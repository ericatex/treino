<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Treino Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0C0C0C;color:#F0EDE8;font-family:system-ui,-apple-system,sans-serif;max-width:500px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
:root{--accent:#F97316;--card:#181818;--card2:#1F1F1F;--border:#2A2A2A;--success:#22C55E;--danger:#EF4444;--muted:#707070;--faint:#303030}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;box-sizing:border-box}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
#header{background:var(--card);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
#header-title{font-weight:900;font-size:15px;letter-spacing:1px;color:var(--accent)}
#header-sub{font-size:10px;color:var(--muted);letter-spacing:.8px;margin-top:1px}
#active-badge{background:#F9731622;border:1px solid #F9731666;border-radius:20px;padding:4px 11px;font-size:11px;color:var(--accent);font-weight:700;display:none}
#content{flex:1;overflow-y:auto;padding:0 16px;padding-bottom:76px}
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20}
.nav-btn{flex:1;padding:11px 0;background:none;border:none;color:var(--muted);border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:1px;transition:color .15s}
.nav-btn.active{color:var(--accent);border-top-color:var(--accent)}
.nav-btn span:first-child{font-size:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.card-inner{padding:16px}
.label{font-size:10px;color:var(--muted);letter-spacing:1px;font-weight:600;margin-bottom:8px}
.section-title{font-weight:800;font-size:20px;letter-spacing:.5px;margin-bottom:4px}
.section-sub{font-size:12px;color:var(--muted)}
input[type=date]{width:100%;background:var(--card2);border:1px solid var(--border);color:#F0EDE8;border-radius:8px;padding:9px 12px;font-size:15px;font-family:inherit}
.semana-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.semana-btn{padding:11px 8px;border-radius:10px;text-align:left;background:var(--card2);border:2px solid var(--border);font-family:inherit;color:#F0EDE8;transition:all .15s}
.semana-btn.sel{background:#F9731622;border-color:var(--accent);color:var(--accent)}
.semana-btn-title{font-weight:700;font-size:14px}
.semana-btn-desc{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.semana-btn.sel .semana-btn-desc{color:var(--accent)}
.treino-btn{display:flex;align-items:center;width:100%;padding:12px 14px;border-radius:10px;text-align:left;background:var(--card2);border:2px solid var(--border);font-family:inherit;color:#F0EDE8;gap:14px;margin-bottom:8px;transition:all .15s}
.treino-btn.sel{background:#F9731622;border-color:var(--accent)}
.treino-letter{width:38px;height:38px;border-radius:10px;background:var(--faint);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--muted);flex-shrink:0;transition:all .15s}
.treino-btn.sel .treino-letter{background:var(--accent);color:#fff}
.treino-btn.sel .treino-name{color:var(--accent)}
.treino-btn.sel .treino-foco,.treino-btn.sel .treino-count{color:var(--accent)}
.treino-name{font-weight:700;font-size:14px}
.treino-foco{font-size:11px;color:var(--muted);margin-top:2px}
.treino-count{font-size:10px;color:var(--faint);margin-top:3px}
.start-btn{width:100%;padding:15px;background:var(--faint);border:none;border-radius:12px;color:var(--muted);font-size:16px;font-weight:800;font-family:inherit;letter-spacing:.5px;transition:all .2s;margin-top:4px}
.start-btn.ready{background:var(--accent);color:#fff;cursor:pointer}
/* Active session */
.session-header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 0 8px}
.session-title{font-weight:800;font-size:20px}
.session-sub{font-size:12px;color:var(--muted);margin-top:2px}
.progress-label{font-size:10px;color:var(--muted);letter-spacing:.5px;text-align:right}
.progress-count{font-weight:900;font-size:24px;color:var(--accent);text-align:right;line-height:1}
.progress-bar-wrap{height:5px;background:var(--border);border-radius:3px;margin-bottom:12px}
.progress-bar{height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width .4s ease}
/* Warmup card */
.wm-card{background:var(--card);border:1px solid #3B82F655;border-radius:14px;overflow:hidden;margin-bottom:12px}
.wm-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:none;width:100%;text-align:left;font-family:inherit;color:#F0EDE8}
.wm-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#3B82F622;border:1px solid #3B82F655;font-size:15px;flex-shrink:0}
.wm-icon.done{background:#22C55E22;border-color:var(--success)}
.wm-title{font-weight:700;font-size:14px;flex:1}
.wm-badge{font-size:10px;background:#3B82F622;color:#60A5FA;border-radius:20px;padding:3px 9px;font-weight:700;letter-spacing:.5px;flex-shrink:0}
.wm-badge.done{background:#22C55E22;color:var(--success)}
.wm-chevron{color:var(--muted);font-size:11px;flex-shrink:0}
.wm-body{padding:6px 14px 14px;border-top:1px solid #3B82F622}
.wm-section{margin-top:12px}
.wm-section-title{font-size:10px;color:#60A5FA;letter-spacing:1px;font-weight:700;margin-bottom:8px}
.wm-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.wm-item:last-child{border-bottom:none}
.wm-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:var(--faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;margin-top:1px;transition:all .15s}
.wm-check.checked{border-color:var(--success);background:#22C55E22;color:var(--success)}
.wm-item-text{font-size:13px;color:#F0EDE8;line-height:1.4;flex:1}
.wm-item-text.checked{color:var(--muted);text-decoration:line-through}
.wm-item-tag{font-size:10px;color:var(--muted);background:var(--faint);border-radius:4px;padding:2px 6px;flex-shrink:0;margin-top:3px}
/* Exercise card */
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;transition:border-color .2s}
.ex-card.open{border-color:#F9731699}
.ex-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:none;width:100%;text-align:left;font-family:inherit;color:#F0EDE8}
.ex-num{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--faint);border:1px solid var(--border);font-weight:700;font-size:12px;color:var(--muted);flex-shrink:0}
.ex-num.done{background:#22C55E22;border-color:var(--success);color:var(--success)}
.ex-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:11px;color:var(--muted);margin-top:2px}
.ex-chevron{color:var(--muted);font-size:11px;flex-shrink:0;margin-left:auto}
.ex-body{padding:0 12px 14px;border-top:1px solid var(--border)}
/* Serie row */
.serie-row{background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-top:10px;overflow:hidden}
.serie-top{display:flex;align-items:center;padding:9px 12px;gap:8px;background:none;border:none;width:100%;text-align:left;font-family:inherit;color:#F0EDE8}
.serie-label{font-weight:800;font-size:13px;color:var(--accent);flex:1}
.serie-summary{font-size:11px;color:var(--muted)}
.serie-chevron{font-size:13px;color:var(--muted)}
.serie-del{background:none;border:none;color:var(--danger);font-size:14px;padding:2px 4px}
.serie-fields{padding:4px 12px 13px;border-top:1px solid var(--border)}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.field-label{font-size:10px;color:var(--muted);letter-spacing:1px;font-weight:600;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:5px}
.step-btn{width:32px;height:32px;background:var(--faint);border:1px solid var(--border);color:#F0EDE8;border-radius:7px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-input{width:54px;height:32px;text-align:center;background:#111;border:1px solid var(--border);color:#F0EDE8;border-radius:7px;font-size:13px}
.rpe-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.rpe-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--faint);color:var(--muted);font-weight:700;font-size:14px;font-family:inherit;transition:all .1s}
.rpe-btn.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.text-input{width:100%;height:32px;background:#111;border:1px solid var(--border);color:#F0EDE8;border-radius:7px;padding:0 8px;font-size:12px;font-family:inherit}
.add-serie-btn{margin-top:10px;width:100%;padding:9px;background:transparent;border:1px dashed #F9731655;border-radius:8px;color:var(--accent);font-size:13px;font-weight:600;font-family:inherit}
.finish-btn{width:100%;padding:15px;background:var(--success);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:800;font-family:inherit;letter-spacing:.5px;margin-top:4px;margin-bottom:12px}
.confirm-box{background:var(--card);border:1px solid var(--success);border-radius:12px;padding:16px;margin-bottom:12px}
.confirm-text{color:#F0EDE8;font-size:14px;font-weight:600;text-align:center;margin-bottom:12px}
.confirm-row{display:flex;gap:10px}
.cancel-btn{flex:1;padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:9px;color:#F0EDE8;font-weight:600;font-family:inherit}
.save-btn{flex:2;padding:11px;background:var(--success);border:none;border-radius:9px;color:#fff;font-weight:800;font-family:inherit;font-size:14px}
/* Historico */
.hist-header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
.hist-empty{padding:70px 20px;text-align:center}
.hist-empty-icon{font-size:40px;margin-bottom:14px;color:var(--faint)}
.export-btn{background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700;font-family:inherit}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.hist-header-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:none;width:100%;text-align:left;font-family:inherit;color:#F0EDE8}
.hist-letter{width:40px;height:40px;border-radius:10px;background:#F9731622;border:1px solid #F9731644;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--accent);flex-shrink:0}
.hist-title{font-weight:700;font-size:14px}
.hist-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hist-body{border-top:1px solid var(--border);padding:12px 16px}
.hist-ex-name{font-weight:700;font-size:13px;color:var(--accent);margin-bottom:7px}
.hist-serie{display:flex;gap:8px;flex-wrap:wrap;padding-left:10px;border-left:2px solid var(--faint);margin-bottom:4px}
.hist-serie-num{color:var(--accent);font-weight:700;font-size:12px}
.hist-serie-val{font-size:12px;color:var(--muted)}
.hist-ex-block{margin-bottom:14px}
/* Timer */
.rest-wrap{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.rest-btn{width:100%;padding:10px;background:var(--faint);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.rest-btn.active{background:#F9731622;border-color:var(--accent);color:var(--accent)}
.rest-btn.done{background:#22C55E22;border-color:var(--success);color:var(--success)}
.rest-progress{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden;display:none}
.rest-progress.show{display:block}
.rest-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear}
/* Instructions */
.info-toggle{margin-left:auto;margin-right:6px;padding:3px 9px;border-radius:6px;background:var(--faint);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;flex-shrink:0}
.info-panel{background:#3B82F60D;border:1px solid #3B82F630;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.info-step{display:flex;gap:9px;margin-bottom:8px;font-size:12px;color:#E0DDD8;line-height:1.5}
.info-step:last-child{margin-bottom:0}
.info-num{width:20px;height:20px;border-radius:50%;background:#3B82F625;color:#60A5FA;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;margin-top:2px}
.info-atencao{display:flex;gap:8px;background:#EF444412;border-left:2px solid #EF4444;border-radius:0 6px 6px 0;padding:8px 10px;margin-top:10px;font-size:11px;color:#FCA5A5;line-height:1.5}
/* Login overlay */
#login-overlay{position:fixed;inset:0;background:#0C0C0C;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
#login-box{width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo-icon{font-size:42px;line-height:1}
.login-title{font-weight:900;font-size:19px;letter-spacing:1px;color:var(--accent);margin-top:10px}
.login-sub{font-size:11px;color:var(--muted);letter-spacing:.8px;margin-top:3px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;font-weight:600;margin-bottom:6px}
.login-input{width:100%;height:46px;background:var(--card2);border:1px solid var(--border);color:#F0EDE8;border-radius:10px;padding:0 14px;font-size:15px;font-family:inherit}
.login-input:focus{outline:none;border-color:var(--accent)}
.login-btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:800;font-family:inherit;letter-spacing:.5px;margin-top:6px;cursor:pointer}
.login-btn:disabled{background:var(--faint);color:var(--muted);cursor:not-allowed}
.login-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.login-switch span{color:var(--accent);font-weight:700;cursor:pointer}
.login-msg{padding:11px 14px;border-radius:9px;font-size:12px;margin-bottom:14px;line-height:1.5}
.login-msg.error{background:#EF444418;border:1px solid #EF444455;color:#FCA5A5}
.login-msg.info{background:#3B82F618;border:1px solid #3B82F655;color:#93C5FD}
.login-msg.warn{background:#F9731618;border:1px solid #F9731655;color:#FDBA74}
/* Sync badge */
#sync-badge{font-size:9px;letter-spacing:.5px;padding:3px 8px;border-radius:20px;font-weight:700;display:none;margin-top:4px}
#sync-badge.online{background:#22C55E22;color:var(--success);display:inline-block}
#sync-badge.offline{background:#F9731622;color:var(--accent);display:inline-block}
#sync-badge.local{background:#70707022;color:var(--muted);display:inline-block}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:11px;font-family:inherit;font-weight:600;cursor:pointer}
/* Install banner */
#install-banner{display:none;background:linear-gradient(135deg,#F9731622,#F9731611);border:1px solid var(--accent);border-radius:12px;padding:14px;margin:14px 0;align-items:center;gap:12px}
#install-banner.show{display:flex}
.install-icon{font-size:26px;flex-shrink:0}
.install-text{flex:1}
.install-title{font-weight:800;font-size:14px;color:var(--accent)}
.install-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.install-action{background:var(--accent);border:none;color:#fff;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">&#127947;</div>
      <div class="login-title">TREINO TRACKER</div>
      <div class="login-sub">BLUEFIT BRASILIA</div>
    </div>
    <div id="login-msg"></div>
    <div class="login-field">
      <label>E-MAIL</label>
      <input class="login-input" type="email" id="login-email" autocomplete="email" placeholder="seu@email.com">
    </div>
    <div class="login-field">
      <label>SENHA</label>
      <input class="login-input" type="password" id="login-senha" autocomplete="current-password" placeholder="minimo 6 caracteres">
    </div>
    <button class="login-btn" id="login-btn" onclick="doAuth()">Entrar</button>
    <div class="login-switch">
      <span id="login-toggle" onclick="toggleAuthMode()">Nao tem conta? Criar agora</span>
    </div>
  </div>
</div>

<div id="header">
  <div>
    <div id="header-title">BLUEFIT BRASILIA</div>
    <div id="header-sub">FASE 1 — ADAPTACAO ANATOMICA</div>
    <span id="sync-badge"></span>
  </div>
  <div id="active-badge">ATIVO</div>
</div>

<div id="install-banner" style="margin:14px 16px 0">
  <div class="install-icon">&#128241;</div>
  <div class="install-text">
    <div class="install-title">Instalar na tela inicial</div>
    <div class="install-sub" id="install-sub">Acesso em 1 toque, sem abrir o navegador</div>
  </div>
  <button class="install-action" id="install-action" onclick="doInstall()">Instalar</button>
</div>

<div id="content"></div>

<div id="bottom-nav">
  <button class="nav-btn active" id="nav-treino" onclick="switchTab('treino')">
    <span>&#9672;</span><span>TREINO</span>
  </button>
  <button class="nav-btn" id="nav-progresso" onclick="switchTab('progresso')">
    <span>&#9650;</span><span>PROGRESSO</span>
  </button>
  <button class="nav-btn" id="nav-historico" onclick="switchTab('historico')">
    <span>&#9673;</span><span>HISTORICO</span>
  </button>
</div>

const firebaseConfig = {

// ▲▲▲ FIM DA CONFIGURACAO ▲▲▲

const CONFIGURADO = !firebaseConfig.apiKey.startsWith('COLE_');

if (!CONFIGURADO) {

} else {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
            onAuthStateChanged, signOut, sendPasswordResetEmail } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const { initializeFirestore, persistentLocalCache, persistentSingleTabManager,
            collection, doc, setDoc, deleteDoc, onSnapshot } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const app = initializeApp(firebaseConfig);

    const db = initializeFirestore(app, {

    window.FB = {

      db: db,
      signIn: (e, p) => signInWithEmailAndPassword(auth, e, p),
      signUp: (e, p) => createUserWithEmailAndPassword(auth, e, p),
      signOut: () => signOut(auth),
      resetSenha: (e) => sendPasswordResetEmail(auth, e),
      onAuth: (cb) => onAuthStateChanged(auth, cb),
      salvarSessao: async (uid, sess) => {
        const ref = doc(db, 'usuarios', uid, 'sessoes', String(sess.id));
        await setDoc(ref, sess);
      },
      apagarSessao: async (uid, id) => {
        await deleteDoc(doc(db, 'usuarios', uid, 'sessoes', String(id)));
      },
      escutarSessoes: (uid, cb) => {
        const ref = collection(db, 'usuarios', uid, 'sessoes');
        return onSnapshot(ref, (snap) => {
          const arr = [];
          snap.forEach(d => arr.push(d.data()));
          arr.sort((a, b) => (b.id || 0) - (a.id || 0));
          cb(arr);
        }, (err) => console.error('Erro no snapshot:', err));
      }
    };
  } catch (err) {
    console.error('Falha ao carregar Firebase:', err);
    window.FB = { ativo: false, erro: err.message };
  }
  window.dispatchEvent(new Event('fb-ready'));
}
</script>

// Setup state
var cfgDate = todayStr();
var cfgSemana = null;
var cfgTreino = null;

var currentUser = null;
var authMode = 'login';
var unsubSessoes = null;
var modoLocal = false;

function setSyncBadge(estado) {
  var b = document.getElementById('sync-badge');
  if (!b) return;
  if (estado === 'online')      { b.className = 'online';  b.textContent = '\u25CF NUVEM'; }
  else if (estado === 'offline'){ b.className = 'offline'; b.textContent = '\u25CB OFFLINE'; }
  else                          { b.className = 'local';   b.textContent = '\u25CB LOCAL'; }
}

function loginMsg(texto, tipo) {
  var el = document.getElementById('login-msg');
  if (!el) return;
  el.innerHTML = texto ? '<div class="login-msg ' + (tipo||'info') + '">' + texto + '</div>' : '';
}

function toggleAuthMode() {
  authMode = (authMode === 'login') ? 'signup' : 'login';
  document.getElementById('login-btn').textContent = (authMode === 'login') ? 'Entrar' : 'Criar conta';
  document.getElementById('login-toggle').textContent = (authMode === 'login')
    ? 'Nao tem conta? Criar agora'
    : 'Ja tem conta? Fazer login';
  document.getElementById('login-senha').setAttribute('autocomplete', authMode === 'login' ? 'current-password' : 'new-password');
  loginMsg('');
}

function traduzErro(code) {
  var mapa = {
    'auth/invalid-email': 'E-mail invalido.',
    'auth/user-not-found': 'Usuario nao encontrado. Crie uma conta primeiro.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Este e-mail ja tem conta. Faca login.',
    'auth/weak-password': 'Senha muito fraca. Use ao menos 6 caracteres.',
    'auth/network-request-failed': 'Sem conexao. Verifique a internet.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.',
    'auth/operation-not-allowed': 'Login por e-mail nao esta ativado no Firebase.'
  };
  return mapa[code] || ('Erro: ' + code);
}

async function doAuth() {
  if (!window.FB || !window.FB.ativo) { entrarModoLocal(); return; }
  var email = document.getElementById('login-email').value.trim();
  var senha = document.getElementById('login-senha').value;
  if (!email || !senha) { loginMsg('Preencha e-mail e senha.', 'error'); return; }
  if (senha.length < 6) { loginMsg('A senha deve ter ao menos 6 caracteres.', 'error'); return; }

  var btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Aguarde...';
  loginMsg('');
  try {
    if (authMode === 'login') await window.FB.signIn(email, senha);
    else {
      await window.FB.signUp(email, senha);
      loginMsg('Conta criada com sucesso!', 'info');
    }
  } catch (err) {
    loginMsg(traduzErro(err.code || err.message), 'error');
    btn.disabled = false;
    btn.textContent = (authMode === 'login') ? 'Entrar' : 'Criar conta';
  }
}

function entrarModoLocal() {
  modoLocal = true;
  document.getElementById('login-overlay').style.display = 'none';
  setSyncBadge('local');
  loadLocal();
  render();
}

async function doLogout() {
  if (!confirm('Sair da conta? Seus dados continuam salvos na nuvem.')) return;
  if (unsubSessoes) { unsubSessoes(); unsubSessoes = null; }
  if (window.FB && window.FB.ativo) await window.FB.signOut();
  currentUser = null;
  sessions = [];
  activeSession = null;
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-btn').textContent = 'Entrar';
  document.getElementById('login-senha').value = '';
  loginMsg('');
}

// ── Armazenamento local (cache offline / modo sem Firebase) ──
function loadLocal() {
  try {
    var raw = localStorage.getItem(KEY);
    sessions = raw ? JSON.parse(raw) : [];
  } catch(e) { sessions = []; }
}

function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(sessions)); } catch(e) {}
}

async function loadData() { loadLocal(); }

async function saveData() {
  saveLocal();
  if (!modoLocal && currentUser && window.FB && window.FB.ativo) {
    try {
      for (var i = 0; i < sessions.length; i++) {
        await window.FB.salvarSessao(currentUser.uid, sessions[i]);
      }
    } catch (e) { console.error('Erro ao sincronizar:', e); }
  }
}

async function salvarSessaoUnica(sess) {
  saveLocal();
  if (!modoLocal && currentUser && window.FB && window.FB.ativo) {
    try { await window.FB.salvarSessao(currentUser.uid, sess); }
    catch (e) { console.error('Erro ao salvar na nuvem:', e); }
  }
}

function exportBackup() {
  var payload = { versao: 1, exportadoEm: new Date().toISOString(), altura: ALTURA, sessions: sessions };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'backup_treinos_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        var incoming = data.sessions || data;
        if (!Array.isArray(incoming)) { alert('Arquivo invalido.'); return; }
        var existingIds = {};
        sessions.forEach(function(s) { existingIds[s.id] = true; });
        var novos = incoming.filter(function(s) { return !existingIds[s.id]; });
        sessions = sessions.concat(novos);
        sessions.sort(function(a,b) { return (b.id||0) - (a.id||0); });
        saveLocal();
        for (var i = 0; i < novos.length; i++) await salvarSessaoUnica(novos[i]);
        render();
        alert(novos.length + ' sessao(oes) importada(s). Total: ' + sessions.length + '.');
      } catch(err) { alert('Erro ao ler o arquivo: ' + err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function switchTab(tab) {
  currentTab = tab;
  ['treino','progresso','historico'].forEach(function(t) {
    var el = document.getElementById('nav-' + t);
    if (el) el.className = 'nav-btn' + (tab === t ? ' active' : '');
  });
  render();
}

function calcIMC(peso) {
  if (!peso || isNaN(parseFloat(peso))) return null;
  return parseFloat((parseFloat(peso) / (ALTURA * ALTURA)).toFixed(1));
}

function imcCategoria(imc) {
  if (!imc) return null;
  if (imc < 18.5) return { label: 'Abaixo do peso', color: '#FBBF24' };
  if (imc < 25)   return { label: 'Peso normal',    color: '#22C55E' };
  if (imc < 30)   return { label: 'Sobrepeso',      color: '#F97316' };
  if (imc < 35)   return { label: 'Obesidade I',    color: '#EF4444' };
  if (imc < 40)   return { label: 'Obesidade II',   color: '#DC2626' };
  return               { label: 'Obesidade III',   color: '#B91C1C' };
}

function startSession() {
  if (!cfgTreino) return;
  var isLeve = (cfgTreino === 'LEVE');
  if (!isLeve && !cfgSemana) return;
  var imc = calcIMC(cfgPeso);
  if (isLeve) {
    activeSession = { id: Date.now(), date: cfgDate, treino: 'LEVE', tipo: 'leve', startedAt: Date.now(), peso: cfgPeso, imc: imc, modalidade: '', cardioMin: '', intensidade: '', corePrancha: false, coreDeadbug: false, mobilidade: false, obs: '', completedAt: null };
  } else {
    var exs = TREINOS[cfgTreino].ex.map(function(ex) {
      return { nome: ex.nome, equip: ex.equip, tipo: ex.tipo, series: [newSerie()] };
    });
    activeSession = { id: Date.now(), date: cfgDate, treino: cfgTreino, semana: cfgSemana, tipo: 'musculacao', startedAt: Date.now(), peso: cfgPeso, imc: imc, completedAt: null, exercises: exs };
  }
  openExIdx = 0;
  openSerieIdx = {};
  confirming = false;
  warmupOpen = true;
  warmupChecks = {};
  openInfo = {};
  if (restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = { exIdx: null, sIdx: null, remaining: 0, total: 0, state: 'idle', intervalId: null };
  render();
}

function finishSession() {
  activeSession.completedAt = Date.now();
  var salva = activeSession;
  sessions.unshift(salva);
  salvarSessaoUnica(salva);
  activeSession = null;
  confirming = false;
  cfgTreino = null;
  cfgSemana = null;
  cfgDate = todayStr();
  currentTab = 'historico';
  expandedHist = salva.id;
  switchTab('historico');
}

function startRest(exIdx, sIdx) {
  if (!activeSession) return;
  var nome = activeSession.exercises[exIdx].nome;
  var info = EX_INFO[nome] || { descanso: 60 };
  var secs = info.descanso;
  if (restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer = { exIdx: exIdx, sIdx: sIdx, remaining: secs, total: secs, state: 'active', intervalId: null };
  updateTimerDisplay();
  restTimer.intervalId = setInterval(function() {
    restTimer.remaining--;
    if (restTimer.remaining <= 0) {
      clearInterval(restTimer.intervalId);
      restTimer.intervalId = null;
      restTimer.state = 'done';
      updateTimerDisplay();
      setTimeout(function() { restTimer.state = 'idle'; updateTimerDisplay(); }, 3000);
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function stopRest() {
  if (restTimer.intervalId) { clearInterval(restTimer.intervalId); restTimer.intervalId = null; }
  restTimer.state = 'idle';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  if (!activeSession) return;
  document.querySelectorAll('[data-timer]').forEach(function(wrap) {
    var ei = parseInt(wrap.getAttribute('data-ei'));
    var si = parseInt(wrap.getAttribute('data-si'));
    var nome = activeSession.exercises[ei].nome;
    var info = EX_INFO[nome] || { descanso: 60 };
    var secs = info.descanso;
    var isThis = restTimer.exIdx === ei && restTimer.sIdx === si;
    var btn = wrap.querySelector('.rest-btn');
    var bar = wrap.querySelector('.rest-progress');
    var barInner = wrap.querySelector('.rest-bar');
    if (!btn) return;
    if (isThis && restTimer.state === 'active') {
      btn.className = 'rest-btn active';
      btn.innerHTML = '&#9646;&#9646; ' + restTimer.remaining + 's restando';
      btn.onclick = stopRest;
      if (bar) { bar.className = 'rest-progress show'; }
      if (barInner) { barInner.style.width = Math.round((restTimer.remaining / restTimer.total) * 100) + '%'; }
    } else if (isThis && restTimer.state === 'done') {
      btn.className = 'rest-btn done';
      btn.innerHTML = '&#10003; Pronto! Proxima serie';
      btn.onclick = function() {};
      if (bar) bar.className = 'rest-progress';
    } else {
      btn.className = 'rest-btn';
      btn.innerHTML = '&#9201; Descansar ' + secs + 's';
      btn.onclick = function() { startRest(ei, si); };
      if (bar) bar.className = 'rest-progress';
    }
  });
}

function toggleInfo(exIdx) { openInfo[exIdx] = !openInfo[exIdx]; render(); }

function render() {
  var badge = document.getElementById('active-badge');
  if (activeSession) {
    badge.style.display = 'block';
    badge.textContent = (activeSession.tipo === 'leve') ? 'DIA LEVE' : ('TREINO ' + activeSession.treino);
  } else {
    badge.style.display = 'none';
  }
  var c = document.getElementById('content');
  if (currentTab === 'treino') {
    if (activeSession) c.innerHTML = activeSession.tipo === 'leve' ? renderLeve() : renderActive();
    else c.innerHTML = renderSetup();
  } else if (currentTab === 'progresso') {
    c.innerHTML = renderProgresso();
  } else {
    c.innerHTML = renderHistorico();
  }
  attachEvents();
}

    html += '<div class="semana-grid">';

function fmtDuration(startedAt, completedAt) {
  if (!startedAt || !completedAt) return '';
  var mins = Math.round((completedAt - startedAt) / 60000);
  return mins + ' min';
}

function renderLeve() {
  var sess = activeSession;
  var html = '<div style="padding:16px 0 20px">';
  html += '<div class="session-header">';
  html += '<div><div class="session-title">Dia Leve</div>';
  html += '<div class="session-sub">' + fmtDate(sess.date) + ' &middot; Cardio + Core + Mobilidade</div>';

    html += '<div style="margin-top:4px;display:flex;align-items:center;gap:6px">';

  html += '</div>';

  // Cardio
  html += '<div class="card"><div class="card-inner" style="display:flex;flex-direction:column;gap:16px">';

  // Modalidade
  html += '<div><div class="label">MODALIDADE</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  ['Esteira','Bicicleta','Eliptico','Outro'].forEach(function(m) {
    var sel = sess.modalidade === m;
    html += '<button onclick="leveSet(\'modalidade\',\'' + m + '\')" style="padding:9px 14px;border-radius:9px;border:2px solid ' + (sel?'var(--accent)':'var(--border)') + ';background:' + (sel?'#F9731622':'var(--card2)') + ';color:' + (sel?'var(--accent)':'#F0EDE8') + ';font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">' + m + '</button>';
  });

  // Duracao
  html += '<div><div class="label">DURACAO DO CARDIO (min) &middot; alvo: 30-40</div>';
  html += '<div class="stepper">';
  html += '<button class="step-btn" onclick="leveStep(\'cardioMin\',-5)">-</button>';
  html += '<input class="step-input" type="number" id="leve-min" value="' + (sess.cardioMin||'') + '" onchange="leveSet(\'cardioMin\',this.value)" placeholder="0" style="width:70px">';
  html += '<button class="step-btn" onclick="leveStep(\'cardioMin\',5)">+</button>';
  html += '</div></div>';

  // Intensidade
  html += '<div><div class="label">INTENSIDADE &middot; alvo: leve a moderada</div>';
  html += '<div style="display:flex;gap:8px">';
  ['Leve','Moderada','Forte'].forEach(function(iN) {
    var sel = sess.intensidade === iN;
    var cor = iN==='Forte' ? '#EF4444' : (iN==='Moderada' ? '#F97316' : '#22C55E');
    html += '<button onclick="leveSet(\'intensidade\',\'' + iN + '\')" style="flex:1;padding:10px;border-radius:9px;border:2px solid ' + (sel?cor:'var(--border)') + ';background:' + (sel?cor+'22':'var(--card2)') + ';color:' + (sel?cor:'var(--muted)') + ';font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">' + iN + '</button>';
  });
  html += '</div></div>';

  html += '</div></div>';

  // Core + mobilidade
  var CHECKS = [
    { k:'corePrancha', t:'Prancha &mdash; 2-3 &times; 20-40s' },
    { k:'coreDeadbug', t:'Dead Bug &mdash; 2-3 &times; 10/lado' },
    { k:'mobilidade', t:'Mobilidade dinamica &mdash; 5-10 min (rotina do aquecimento)' }
  ];
  html += '<div class="card"><div class="card-inner">';
  html += '<div class="label">CORE + MOBILIDADE</div>';
  CHECKS.forEach(function(c) {
    var chk = sess[c.k];
    html += '<div class="wm-item">';
    html += '<div class="wm-check' + (chk?' checked':'') + '" onclick="leveToggle(\'' + c.k + '\')">' + (chk?'&#10003;':'') + '</div>';
    html += '<div class="wm-item-text' + (chk?' checked':'') + '">' + c.t + '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // Observacoes
  html += '<div class="card"><div class="card-inner">';
  html += '<div class="label">OBSERVACOES</div>';
  html += '<textarea id="leve-obs" onchange="leveSet(\'obs\',this.value)" placeholder="Disposicao, sensacoes, como foi..." style="width:100%;min-height:80px;background:#111;border:1px solid var(--border);color:#F0EDE8;border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.5">' + (sess.obs||'') + '</textarea>';
  html += '</div></div>';

  if (!confirming) {
    html += '<button class="finish-btn" onclick="showConfirm()">Finalizar Dia Leve</button>';
  } else {
    html += '<div class="confirm-box">';
    html += '<div class="confirm-text">Salvar sessao no historico?</div>';
    html += '<div class="confirm-row">';
    html += '<button class="cancel-btn" onclick="cancelConfirm()">Cancelar</button>';
    html += '<button class="save-btn" onclick="finishSession()">Sim, salvar!</button>';
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

function leveSet(field, val) {
  if (!activeSession) return;
  activeSession[field] = val;
  if (field === 'modalidade' || field === 'intensidade') render();
}
function leveStep(field, delta) {
  if (!activeSession) return;
  var cur = parseFloat(activeSession[field]) || 0;
  activeSession[field] = String(Math.max(0, cur + delta));
  render();
}
function leveToggle(k) {
  if (!activeSession) return;
  activeSession[k] = !activeSession[k];
  render();
}

    'Balanco de perna — 10/perna',
    'Agachamento corporal — 10x',
    'Afundo com rotacao — 8/lado',
    'Circulos de quadril — 10/direcao',
    'Elevacao pelvica no solo — 12x',
    'Circulos de braco — 15/direcao'
  ];
  var totalItems = 2 + MOB.length;
  var totalChecked = (warmupChecks['cardio'] ? 1 : 0)
    + MOB.filter(function(_,i) { return warmupChecks['mob_'+i]; }).length
    + (warmupChecks['especifico'] ? 1 : 0);
  var allDone = totalChecked === totalItems;

  var html = '<div class="wm-card">';
  html += '<button class="wm-header" onclick="toggleWarmup()">';
  html += '<div class="wm-icon' + (allDone?' done':'') + '">' + (allDone?'&#10003;':'&#9728;') + '</div>';
  html += '<div class="wm-title">Aquecimento</div>';
  html += '<div class="wm-badge' + (allDone?' done':'') + '">' + totalChecked + '/' + totalItems + '</div>';
  html += '<div class="wm-chevron">' + (warmupOpen?'&#9650;':'&#9660;') + '</div>';
  html += '</button>';

  if (warmupOpen) {
    html += '<div class="wm-body">';

    // Cardio
    html += '<div class="wm-section">';
    html += '<div class="wm-section-title">CARDIO LEVE &mdash; 5 MIN</div>';
    html += '<div class="wm-item">';
    html += '<div class="wm-check' + (warmupChecks['cardio']?' checked':'') + '" onclick="toggleWarmupItem(\'cardio\')">' + (warmupChecks['cardio']?'&#10003;':'') + '</div>';
    html += '<div class="wm-item-text' + (warmupChecks['cardio']?' checked':'') + '">Esteira, bicicleta ou eliptico em intensidade baixa</div>';
    html += '<div class="wm-item-tag">5 min</div>';
    html += '</div></div>';

    // Mobilidade
    html += '<div class="wm-section">';
    html += '<div class="wm-section-title">MOBILIDADE DINAMICA &mdash; 5-7 MIN</div>';
    MOB.forEach(function(item, i) {
      var chk = warmupChecks['mob_'+i];
      html += '<div class="wm-item" style="flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0">';
      html += '<div style="display:flex;align-items:center;gap:10px;width:100%">';
      html += '<div class="wm-check' + (chk?' checked':'') + '" onclick="toggleWarmupItem(\'mob_'+i+'\')" style="flex-shrink:0">' + (chk?'&#10003;':'') + '</div>';
      html += '<div class="wm-item-text' + (chk?' checked':'') + '" style="flex:1;font-weight:600">' + item + '</div>';
      html += '</div>';
      html += '<div style="display:flex;justify-content:center;width:100%;padding:6px 0 2px;opacity:' + (chk?'0.25':'1') + ';transition:opacity .3s">' + GIFS[i] + '</div>';
      html += '</div>';
    });
    html += '</div>';

    // Especifico
    html += '<div class="wm-section">';
    html += '<div class="wm-section-title">AQUECIMENTO ESPECIFICO</div>';
    html += '<div class="wm-item">';
    html += '<div class="wm-check' + (warmupChecks['especifico']?' checked':'') + '" onclick="toggleWarmupItem(\'especifico\')">' + (warmupChecks['especifico']?'&#10003;':'') + '</div>';
    html += '<div class="wm-item-text' + (warmupChecks['especifico']?' checked':'') + '">1-2 series de 6-8 reps com 50% da carga antes de cada exercicio composto</div>';
    html += '</div></div>';

    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderActive() {
  var sess = activeSession;
  var completed = sess.exercises.filter(function(ex) {
    return ex.series.some(function(s) { return s.reps || s.carga; });
  }).length;
  var total = sess.exercises.length;
  var pct = total ? Math.round((completed/total)*100) : 0;

  var html = '<div style="padding:16px 0 20px">';

  // Header
  html += '<div class="session-header">';
  html += '<div><div class="session-title">Treino ' + sess.treino + '</div>';
  html += '<div class="session-sub">' + fmtDate(sess.date) + ' &middot; Semanas ' + sess.semana + '</div>';
  if (sess.peso) {
    var sc = imcCategoria(sess.imc);
    html += '<div style="margin-top:4px;display:flex;align-items:center;gap:6px">';
    html += '<span style="font-size:11px;color:var(--muted)">' + sess.peso + ' kg &middot; IMC</span>';
    html += '<span style="font-weight:800;font-size:13px;color:' + (sc?sc.color:'var(--muted)') + '">' + sess.imc + '</span>';
    if (sc) html += '<span style="font-size:10px;color:' + sc.color + ';background:' + sc.color + '22;border-radius:10px;padding:1px 7px;font-weight:700">' + sc.label + '</span>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div><div class="progress-label">EXERCICIOS</div>';
  html += '<div class="progress-count">' + completed + '<span style="font-size:14px;color:var(--muted)">/' + total + '</span></div></div>';
  html += '</div>';

  // Progress bar
  html += '<div class="progress-bar-wrap"><div class="progress-bar" style="width:' + pct + '%"></div></div>';

  // Warmup
  html += renderWarmup();

  // Exercises
  sess.exercises.forEach(function(ex, exIdx) {
    var meta = getMeta(sess.semana, ex.tipo);
    var isOpen = openExIdx === exIdx;
    var hasData = ex.series.some(function(s) { return s.reps || s.carga; });
    var infoOpen = openInfo[exIdx];
    var exInfo = EX_INFO[ex.nome] || null;
    html += '<div class="ex-card' + (isOpen?' open':'') + '" id="excard-' + exIdx + '">';
    html += '<button class="ex-header" onclick="toggleEx(' + exIdx + ')">';
    html += '<div class="ex-num' + (hasData?' done':'') + '">' + (hasData?'&#10003;':(exIdx+1)) + '</div>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div class="ex-name">' + ex.nome + '</div>';
    html += '<div class="ex-meta">' + ex.equip + ' &middot; ' + meta.series + '&times; &middot; ' + meta.alvo + ' &middot; RPE ' + meta.rpe + '</div>';
    html += '</div>';
    if (exInfo) html += '</button><button class="info-toggle" onclick="toggleInfo(' + exIdx + ')" title="Ver execucao">&#9432;' + (infoOpen?' &#9650;':' &#9660;') + '</button><button class="ex-header" style="padding:14px 16px 14px 4px;width:auto" onclick="toggleEx(' + exIdx + ')">';
    html += '<div class="ex-chevron">' + (isOpen?'&#9650;':'&#9660;') + '</div>';
    html += '</button>';
    if (isOpen) {
      html += '<div class="ex-body">';
      // Info panel
      if (infoOpen && exInfo) {
        html += '<div class="info-panel">';
        exInfo.dicas.forEach(function(dica, di) {
          html += '<div class="info-step"><div class="info-num">' + (di+1) + '</div><div>' + dica + '</div></div>';
        });
        html += '<div class="info-atencao"><span style="font-size:14px;flex-shrink:0">&#9888;</span><div>' + exInfo.atencao + '</div></div>';
        html += '</div>';
      }
      ex.series.forEach(function(serie, sIdx) {
        html += renderSerie(serie, sIdx, ex.tipo, meta, exIdx, ex.series.length > 1);
      });
      html += '<button class="add-serie-btn" onclick="addSerie(' + exIdx + ')">+ Adicionar Serie</button>';
      html += '</div>';
    }
    html += '</div>';
  });

  // Finish
  if (!confirming) {
    html += '<button class="finish-btn" onclick="showConfirm()">Finalizar Treino</button>';
  } else {
    html += '<div class="confirm-box">';
    html += '<div class="confirm-text">Salvar sessao no historico?</div>';
    html += '<div class="confirm-row">';
    html += '<button class="cancel-btn" onclick="cancelConfirm()">Cancelar</button>';
    html += '<button class="save-btn" onclick="finishSession()">Sim, salvar!</button>';
    html += '</div></div>';
  }

  html += '</div>';
  return html;
}

function renderSerie(serie, sIdx, tipo, meta, exIdx, canDel) {
  var isOpen = openSerieIdx[exIdx + '_' + sIdx] !== false;
  var unit = repsUnit(tipo);
  var label = repsLabel(tipo);
  var summary = '';
  if (!isOpen) {
    if (serie.carga) summary += serie.carga + 'kg';
    if (serie.reps) summary += (summary?' · ':'') + serie.reps + unit;
    if (serie.rpe) summary += (summary?' · ':'') + 'RPE ' + serie.rpe;
  }

  var html = '<div class="serie-row" id="serie-' + exIdx + '-' + sIdx + '">';
  html += '<button class="serie-top" onclick="toggleSerie(' + exIdx + ',' + sIdx + ')">';
  html += '<span class="serie-label">Serie ' + (sIdx+1) + '</span>';
  if (summary) html += '<span class="serie-summary">' + summary + '</span>';
  html += '<span class="serie-chevron">' + (isOpen?'&#9650;':'&#9660;') + '</span>';
  if (canDel) html += '</button><button class="serie-del" onclick="removeSerie(' + exIdx + ',' + sIdx + ')">&#10005;</button>';
  else html += '</button>';

  if (isOpen) {
    html += '<div class="serie-fields">';
    html += '<div class="fields-grid">';

    // Carga
    html += '<div><div class="field-label">CARGA (kg)</div>';
    html += '<div class="stepper">';
    html += '<button class="step-btn" onclick="stepVal(' + exIdx + ',' + sIdx + ',\'carga\',-0.5)">-</button>';
    html += '<input class="step-input" type="number" id="f-' + exIdx + '-' + sIdx + '-carga" value="' + (serie.carga||'') + '" onchange="setVal(' + exIdx + ',' + sIdx + ',\'carga\',this.value)" placeholder="0">';
    html += '<button class="step-btn" onclick="stepVal(' + exIdx + ',' + sIdx + ',\'carga\',0.5)">+</button>';
    html += '</div></div>';

    // Reps
    html += '<div><div class="field-label">' + label.toUpperCase() + ' &middot; alvo: ' + meta.alvo + '</div>';
    html += '<div class="stepper">';
    html += '<button class="step-btn" onclick="stepVal(' + exIdx + ',' + sIdx + ',\'reps\',-1)">-</button>';
    html += '<input class="step-input" type="number" id="f-' + exIdx + '-' + sIdx + '-reps" value="' + (serie.reps||'') + '" onchange="setVal(' + exIdx + ',' + sIdx + ',\'reps\',this.value)" placeholder="0">';
    html += '<button class="step-btn" onclick="stepVal(' + exIdx + ',' + sIdx + ',\'reps\',1)">+</button>';
    html += '</div></div>';
    html += '</div>';

    // RPE
    html += '<div style="margin-top:12px"><div class="field-label">RPE &middot; alvo: ' + meta.rpe + '</div>';
    html += '<div class="rpe-row">';
    [5,6,7,8,9,10].forEach(function(n) {
      var sel = serie.rpe === String(n) ? ' sel' : '';
      html += '<button class="rpe-btn' + sel + '" onclick="setRpe(' + exIdx + ',' + sIdx + ',' + n + ')">' + n + '</button>';
    });
    html += '</div></div>';

    // Ajuste (full width)
    html += '<div style="margin-top:12px"><div class="field-label">AJUSTE APARELHO</div>';
    html += '<input class="text-input" type="text" id="f-' + exIdx + '-' + sIdx + '-ajuste" value="' + (serie.ajuste||'').replace(/"/g,'&quot;') + '" onchange="setVal(' + exIdx + ',' + sIdx + ',\'ajuste\',this.value)" placeholder="ex: banco pos. 3, pino 6...">';
    html += '</div>';

    // Rest timer
    html += '<div class="rest-wrap" data-timer="1" data-ei="' + exIdx + '" data-si="' + sIdx + '">';
    html += '<button class="rest-btn" onclick="startRest(' + exIdx + ',' + sIdx + ')">&#9201; Descansar</button>';
    html += '<div class="rest-progress"><div class="rest-bar" style="width:100%"></div></div>';
    html += '</div>';

    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderHistorico() {
  var html = '<div style="padding:16px 0">';
  html += '<div class="hist-header">';
  html += '<div><div class="section-title">Historico</div>';
  var totSeries = sessions.reduce(function(a,s) { return a + (s.exercises ? s.exercises.reduce(function(b,e) { return b + e.series.length; },0) : 0); },0);
  html += '<div class="section-sub">' + sessions.length + ' sessao(oes) &middot; ' + totSeries + ' series</div></div>';
  if (currentUser) html += '<button class="logout-btn" onclick="doLogout()">Sair</button>';
  html += '</div>';

  if (currentUser) {
    html += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px">';
    html += '<span style="color:var(--success)">&#9679;</span> Sincronizado como ' + currentUser.email;
    html += '</div>';
  } else if (modoLocal) {
    html += '<div class="login-msg warn" style="margin-bottom:12px">Modo local: os dados ficam so neste aparelho. Faca backup regularmente.</div>';
  }

  // Backup bar
  html += '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  html += '<button class="export-btn" onclick="exportCSV()" style="flex:1;min-width:90px">&#8595; CSV</button>';
  html += '<button class="export-btn" onclick="exportBackup()" style="flex:1;min-width:90px;border-color:#22C55E;color:#22C55E">&#128190; Backup</button>';
  html += '<button class="export-btn" onclick="importBackup()" style="flex:1;min-width:90px;border-color:#3B82F6;color:#60A5FA">&#8593; Restaurar</button>';
  html += '</div>';

  if (!sessions.length) {
    html += '<div class="hist-empty">';
    html += '<div class="hist-empty-icon">&#9711;</div>';
    html += '<div style="font-weight:700;font-size:16px;color:#F0EDE8">Nenhum treino registrado</div>';
    html += '<div style="font-size:13px;color:var(--muted);margin-top:6px">Finalize seu primeiro treino para ver o historico.</div>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  sessions.forEach(function(sess) {
    var isExp = expandedHist === sess.id;
    var isAqua = sess.tipo === 'aquatico';
    var isLeve = sess.tipo === 'leve';
    var labels = { NAT:'Natacao', HIDRO:'Hidro', OUTRO:'Outro' };
    var dur = fmtDuration(sess.startedAt, sess.completedAt);
    var tSeries = 0, cExs = 0;
    if (!isAqua && !isLeve && sess.exercises) {
      tSeries = sess.exercises.reduce(function(a,ex) { return a + ex.series.length; },0);
      cExs = sess.exercises.filter(function(ex) { return ex.series.some(function(s) { return s.reps||s.carga; }); }).length;
    }
    var coreN = isLeve ? ((sess.corePrancha?1:0)+(sess.coreDeadbug?1:0)+(sess.mobilidade?1:0)) : 0;
    html += '<div class="hist-card">';
    html += '<button class="hist-header-row" onclick="toggleHist(' + sess.id + ')">';
    var letterStyle = '';
    if (isAqua) letterStyle = 'background:#3B82F622;border-color:#3B82F644;color:#60A5FA;font-size:16px';
    else if (isLeve) letterStyle = 'background:#22C55E22;border-color:#22C55E44;color:#22C55E';
    html += '<div class="hist-letter" style="' + letterStyle + '">';
    html += isAqua ? (sess.treino === 'NAT' ? '◎' : sess.treino === 'HIDRO' ? '◉' : '◈') : (isLeve ? 'L' : sess.treino);
    html += '</div>';
    html += '<div style="flex:1"><div class="hist-title">' + fmtDate(sess.date) + ' &middot; ' + (isAqua ? (labels[sess.treino]||sess.treino) : (isLeve ? 'Dia Leve' : 'Treino ' + sess.treino)) + '</div>';
    if (isAqua) {
      html += '<div class="hist-sub">' + (sess.duracao ? sess.duracao + ' min' : 'sem duracao') + (dur ? ' &middot; durou ' + dur : '') + (sess.peso ? ' &middot; ' + sess.peso + 'kg' : '') + '</div>';
    } else if (isLeve) {
      html += '<div class="hist-sub">' + (sess.modalidade||'Cardio') + (sess.cardioMin ? ' &middot; ' + sess.cardioMin + ' min' : '') + ' &middot; core/mob ' + coreN + '/3' + (sess.peso ? ' &middot; ' + sess.peso + 'kg' : '') + '</div>';
    } else {
      html += '<div class="hist-sub">Sem. ' + (sess.semana||'') + ' &middot; ' + cExs + '/' + (sess.exercises ? sess.exercises.length : 0) + ' exerc. &middot; ' + tSeries + ' series' + (dur ? ' &middot; ' + dur : '') + (sess.peso ? ' &middot; ' + sess.peso + 'kg' : '') + '</div>';
    }
    html += '</div>';
    html += '<span style="color:var(--muted);font-size:11px">' + (isExp?'&#9650;':'&#9660;') + '</span>';
    html += '</button>';
    if (isExp) {
      html += '<div class="hist-body">';
      if (isLeve) {
        if (sess.intensidade) html += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Intensidade: ' + sess.intensidade + '</div>';
        var feitosH = [];
        if (sess.corePrancha) feitosH.push('Prancha');
        if (sess.coreDeadbug) feitosH.push('Dead Bug');
        if (sess.mobilidade) feitosH.push('Mobilidade');
        html += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Feito: ' + (feitosH.length ? feitosH.join(', ') : 'nada marcado') + '</div>';
        if (sess.obs) html += '<div style="font-size:13px;color:#F0EDE8;line-height:1.5;white-space:pre-wrap">' + sess.obs + '</div>';
      } else if (isAqua) {
        if (sess.distancia) html += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Distancia: ' + sess.distancia + ' m</div>';
        if (sess.obs) html += '<div style="font-size:13px;color:#F0EDE8;line-height:1.5;white-space:pre-wrap">' + sess.obs + '</div>';
        else html += '<div style="font-size:13px;color:var(--faint)">Sem observacoes.</div>';
      } else if (sess.exercises) {
        sess.exercises.forEach(function(ex) {
          html += '<div class="hist-ex-block">';
          html += '<div class="hist-ex-name">' + ex.nome + '</div>';
          ex.series.forEach(function(s, si) {
            var unit = repsUnit(ex.tipo);
            var items = [];
            if (s.carga) items.push(s.carga + ' kg');
            if (s.reps) items.push(s.reps + unit + ' reps');
            if (s.rpe) items.push('RPE ' + s.rpe);
            html += '<div class="hist-serie">';
            html += '<span class="hist-serie-num">S' + (si+1) + '</span>';
            if (items.length) {
              items.forEach(function(item) { html += '<span class="hist-serie-val">' + item + '</span>'; });
            } else {
              html += '<span style="font-size:12px;color:var(--faint)">sem dados</span>';
            }
            if (s.ajuste) html += '<span style="font-size:12px;color:#F0EDE8;font-style:italic">' + s.ajuste + '</span>';
            html += '</div>';
          });
          html += '</div>';
        });
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Progresso ──────────────────────────────────────────────
var progExercicio = null;

function weekStart(dateStr) {
  var d = new Date(dateStr + 'T12:00:00');
  var day = d.getDay();
  var diff = (day === 0) ? 6 : day - 1;
  d.setDate(d.getDate() - diff);
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var dd = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + dd;
}

function fmtDDMM(iso) {
  var p = iso.split('-');
  return p[2] + '/' + p[1];
}

function progCard(titulo, inner) {
  return '<div class="card"><div class="card-inner"><div class="label">' + titulo + '</div>' + inner + '</div></div>';
}

function progVazio(msg) {
  return '<div style="font-size:12px;color:var(--muted);padding:16px 0;text-align:center">' + msg + '</div>';
}

function svgBarAderencia(weeks) {
  var W = 340, H = 175, padL = 24, padB = 24, padT = 20, padR = 8;
  var cw = W - padL - padR, ch = H - padT - padB;
  var maxY = 6;
  var n = weeks.length;
  var gap = cw / n;
  var bw = Math.min(36, gap * 0.62);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">';
  [0, 2, 4, 6].forEach(function(v) {
    var y = padT + ch - (v / maxY) * ch;
    s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#2A2A2A" stroke-width="1"/>';
    s += '<text x="' + (padL - 5) + '" y="' + (y + 3) + '" fill="#707070" font-size="9" text-anchor="end">' + v + '</text>';
  });
  var yGoal = padT + ch - (5 / maxY) * ch;
  s += '<line x1="' + padL + '" y1="' + yGoal + '" x2="' + (W - padR) + '" y2="' + yGoal + '" stroke="#22C55E" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.65"/>';
  s += '<text x="' + (W - padR) + '" y="' + (yGoal - 4) + '" fill="#22C55E" font-size="8.5" text-anchor="end" opacity="0.85">meta 5+</text>';
  weeks.forEach(function(w, i) {
    var x = padL + gap * i + gap / 2 - bw / 2;
    var h = (w.count / maxY) * ch;
    var y = padT + ch - h;
    var cor = w.count >= 5 ? '#22C55E' : (w.count >= 3 ? '#F97316' : '#707070');
    s += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(h, 2) + '" rx="4" fill="' + cor + '"/>';
    if (w.count > 0) s += '<text x="' + (x + bw / 2) + '" y="' + (y - 5) + '" fill="' + cor + '" font-size="10.5" font-weight="700" text-anchor="middle">' + w.count + '</text>';
    s += '<text x="' + (x + bw / 2) + '" y="' + (H - 7) + '" fill="#707070" font-size="8.5" text-anchor="middle">' + fmtDDMM(w.ws) + '</text>';
  });
  s += '</svg>';
  return s;
}

function svgLinha(points, cor) {
  var W = 340, H = 175, padL = 36, padB = 24, padT = 20, padR = 12;
  var cw = W - padL - padR, ch = H - padT - padB;
  var vals = points.map(function(p) { return p.val; });
  var mn = Math.min.apply(null, vals);
  var mx = Math.max.apply(null, vals);
  if (mn === mx) { mn -= 1; mx += 1; }
  var range = mx - mn;
  mn -= range * 0.18;
  mx += range * 0.18;
  function X(i) { return points.length === 1 ? padL + cw / 2 : padL + (i / (points.length - 1)) * cw; }
  function Y(v) { return padT + ch - ((v - mn) / (mx - mn)) * ch; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">';
  for (var g = 0; g <= 3; g++) {
    var gv = mn + (mx - mn) * g / 3;
    var gy = Y(gv);
    s += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#2A2A2A" stroke-width="1"/>';
    s += '<text x="' + (padL - 5) + '" y="' + (gy + 3) + '" fill="#707070" font-size="8.5" text-anchor="end">' + gv.toFixed(1) + '</text>';
  }
  if (points.length > 1) {
    var pts = points.map(function(p, i) { return X(i) + ',' + Y(p.val); }).join(' ');
    s += '<polyline points="' + pts + '" fill="none" stroke="' + cor + '" stroke-width="2" stroke-linejoin="round"/>';
  }
  points.forEach(function(p, i) {
    s += '<circle cx="' + X(i) + '" cy="' + Y(p.val) + '" r="3.5" fill="' + cor + '"/>';
    s += '<text x="' + X(i) + '" y="' + (Y(p.val) - 8) + '" fill="' + cor + '" font-size="9" font-weight="700" text-anchor="middle">' + p.val + '</text>';
    var showX = points.length <= 7 || i % 2 === 0 || i === points.length - 1;
    if (showX) s += '<text x="' + X(i) + '" y="' + (H - 7) + '" fill="#707070" font-size="8.5" text-anchor="middle">' + p.label + '</text>';
  });
  s += '</svg>';
  return s;
}

function setProgEx(v) { progExercicio = v; render(); }

function renderProgresso() {
  var html = '<div style="padding:16px 0">';
  html += '<div class="section-title" style="margin-bottom:4px">Progresso</div>';

  if (!sessions.length) {
    html += '<div class="hist-empty">';
    html += '<div class="hist-empty-icon">&#9650;</div>';
    html += '<div style="font-weight:700;font-size:16px;color:#F0EDE8">Sem dados ainda</div>';
    html += '<div style="font-size:13px;color:var(--muted);margin-top:6px">Registre seus primeiros treinos e os graficos aparecem aqui.</div>';
    html += '</div></div>';
    return html;
  }

  var asc = sessions.slice().sort(function(a, b) {
    return (a.date === b.date) ? (a.id - b.id) : (a.date < b.date ? -1 : 1);
  });

  html += '<div class="section-sub" style="margin-bottom:14px">' + sessions.length + ' sessao(oes) registradas</div>';

  // 1) Aderencia
  var byWeek = {};
  asc.forEach(function(s) {
    var ws = weekStart(s.date);
    if (!byWeek[ws]) byWeek[ws] = {};
    byWeek[ws][s.date] = true;
  });
  var weeks = Object.keys(byWeek).sort().map(function(ws) {
    return { ws: ws, count: Object.keys(byWeek[ws]).length };
  }).slice(-8);
  html += progCard('ADERENCIA — DIAS TREINADOS POR SEMANA (META: 5+ DE 6)', svgBarAderencia(weeks));

  // 2) Peso medio semanal
  var wByWeek = {};
  asc.forEach(function(s) {
    var p = parseFloat(s.peso);
    if (!p) return;
    var ws = weekStart(s.date);
    if (!wByWeek[ws]) wByWeek[ws] = [];
    wByWeek[ws].push(p);
  });
  var wkeys = Object.keys(wByWeek).sort();
  if (wkeys.length) {
    var wpoints = wkeys.map(function(ws) {
      var arr = wByWeek[ws];
      var avg = arr.reduce(function(a, b) { return a + b; }, 0) / arr.length;
      return { label: fmtDDMM(ws), val: parseFloat(avg.toFixed(1)) };
    }).slice(-10);
    html += progCard('PESO — MEDIA SEMANAL (kg)', svgLinha(wpoints, '#F97316') +
      '<div style="font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4">Media das pesagens da semana. Leia a tendencia, nao o dia isolado.</div>');
  } else {
    html += progCard('PESO — MEDIA SEMANAL (kg)', progVazio('Registre o peso no inicio das sessoes para ver a curva.'));
  }

  // 3) Carga por exercicio
  var exSet = {};
  asc.forEach(function(s) {
    if (s.tipo !== 'musculacao' || !s.exercises) return;
    s.exercises.forEach(function(ex) {
      if (ex.series && ex.series.some(function(sr) { return parseFloat(sr.carga) > 0; })) exSet[ex.nome] = true;
    });
  });
  var exList = Object.keys(exSet);
  if (exList.length) {
    if (!progExercicio || exList.indexOf(progExercicio) === -1) progExercicio = exList[0];
    var selHtml = '<select onchange="setProgEx(this.value)" style="width:100%;background:var(--card2);border:1px solid var(--border);color:#F0EDE8;border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;margin-bottom:10px">';
    exList.forEach(function(n) {
      selHtml += '<option value="' + n + '"' + (n === progExercicio ? ' selected' : '') + '>' + n + '</option>';
    });
    selHtml += '</select>';
    var lpoints = [];
    asc.forEach(function(s) {
      if (s.tipo !== 'musculacao' || !s.exercises) return;
      var ex = null;
      for (var i = 0; i < s.exercises.length; i++) {
        if (s.exercises[i].nome === progExercicio) { ex = s.exercises[i]; break; }
      }
      if (!ex) return;
      var mx = 0;
      ex.series.forEach(function(sr) {
        var c = parseFloat(sr.carga);
        if (c > mx) mx = c;
      });
      if (mx > 0) lpoints.push({ label: fmtDDMM(s.date), val: mx });
    });
    lpoints = lpoints.slice(-12);
    var inner = selHtml + (lpoints.length
      ? svgLinha(lpoints, '#60A5FA') + '<div style="font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4">Maior carga registrada por sessao. E aqui que a tonificacao aparece primeiro.</div>'
      : progVazio('Sem cargas registradas para este exercicio.'));
    html += progCard('CARGA — EVOLUCAO POR EXERCICIO (kg)', inner);
  } else {
    html += progCard('CARGA — EVOLUCAO POR EXERCICIO (kg)', progVazio('Registre as cargas nos treinos de forca para ver a evolucao.'));
  }

  html += '</div>';
  return html;
}

function attachEvents() {
  var dateEl = document.getElementById('cfg-date');
  if (dateEl) dateEl.addEventListener('change', function() { cfgDate = this.value; });
  var pesoEl = document.getElementById('cfg-peso');
  if (pesoEl) pesoEl.addEventListener('change', function() { setPeso(this.value); });
  updateTimerDisplay();
}

// Event handlers
function selectSemana(v) { cfgSemana = v; render(); }
function selectTreino(t) {
  cfgTreino = t;
  if (t === 'LEVE') cfgSemana = null;
  render();
}
function setPeso(v) { cfgPeso = v; render(); }
function stepPeso(delta) {
  var cur = parseFloat(cfgPeso) || 50.0;
  cfgPeso = String(parseFloat(Math.max(50.0, cur + delta).toFixed(1)));
  render();
}
function toggleEx(idx) { openExIdx = openExIdx === idx ? null : idx; render(); }
function toggleWarmup() { warmupOpen = !warmupOpen; render(); }
function toggleWarmupItem(key) { warmupChecks[key] = !warmupChecks[key]; render(); }
function showConfirm() { confirming = true; render(); }
function cancelConfirm() { confirming = false; render(); }
function toggleHist(id) { expandedHist = expandedHist === id ? null : id; render(); }

function toggleSerie(exIdx, sIdx) {
  var key = exIdx + '_' + sIdx;
  openSerieIdx[key] = openSerieIdx[key] === false ? true : false;
  render();
}

function setVal(exIdx, sIdx, field, val) {
  if (!activeSession) return;
  activeSession.exercises[exIdx].series[sIdx][field] = val;
}

function stepVal(exIdx, sIdx, field, delta) {
  if (!activeSession) return;
  var cur = parseFloat(activeSession.exercises[exIdx].series[sIdx][field]) || 0;
  var nv = cur + delta;
  if (nv < 0) nv = 0;
  nv = parseFloat(nv.toFixed(2));
  activeSession.exercises[exIdx].series[sIdx][field] = String(nv);
  render();
}

function setRpe(exIdx, sIdx, n) {
  if (!activeSession) return;
  var cur = activeSession.exercises[exIdx].series[sIdx].rpe;
  activeSession.exercises[exIdx].series[sIdx].rpe = cur === String(n) ? '' : String(n);
  render();
}

function addSerie(exIdx) {
  if (!activeSession) return;
  activeSession.exercises[exIdx].series.push(newSerie());
  render();
}

function removeSerie(exIdx, sIdx) {
  if (!activeSession) return;
  var srs = activeSession.exercises[exIdx].series;
  if (srs.length <= 1) return;
  srs.splice(sIdx, 1);
  render();
}

function exportCSV() {
  var rows = ['Data,Tipo,Treino,Semana,Duracao,Peso (kg),IMC,Exercicio,Serie,Carga (kg),Reps/Tempo,RPE,Ajuste Aparelho,Observacoes'];
  sessions.forEach(function(sess) {
    var dur = fmtDuration(sess.startedAt, sess.completedAt);
    var peso = sess.peso || '';
    var imc = sess.imc || '';
    if (sess.tipo === 'leve') {
      var feitosC = [];
      if (sess.corePrancha) feitosC.push('Prancha');
      if (sess.coreDeadbug) feitosC.push('Dead Bug');
      if (sess.mobilidade) feitosC.push('Mobilidade');
      var obsL = 'Intensidade: ' + (sess.intensidade||'-') + '; Feito: ' + (feitosC.length ? feitosC.join(' / ') : '-') + (sess.obs ? '; ' + sess.obs.replace(/"/g,'') : '');
      rows.push([
        sess.date, 'Dia leve', '"' + (sess.modalidade||'') + '"', '',
        (sess.cardioMin ? sess.cardioMin + ' min' : ''), peso, imc, '', '', '', '', '', '',
        '"' + obsL + '"'
      ].join(','));
    } else if (sess.tipo === 'aquatico') {
      var labels = { NAT:'Natacao', HIDRO:'Hidroginastica', OUTRO:'Outra atividade' };
      rows.push([
        sess.date, 'Aquatico', '"' + (labels[sess.treino]||sess.treino) + '"', '',
        (sess.duracao ? sess.duracao + ' min' : ''), peso, imc, '', '', '', '', '', '',
        '"' + (sess.obs||'').replace(/"/g,'') + '"'
      ].join(','));
    } else {
      if (!sess.exercises) return;
      sess.exercises.forEach(function(ex) {
        ex.series.forEach(function(s, i) {
          rows.push([
            sess.date, 'Musculacao', 'Treino ' + sess.treino, 'Semanas ' + (sess.semana||''),
            dur, peso, imc, '"' + ex.nome + '"', i+1, s.carga||'', s.reps||'', s.rpe||'',
            '"' + (s.ajuste||'') + '"', ''
          ].join(','));
        });
      });
    }
  });
  var blob = new Blob(['\uFEFF' + rows.join('\n')], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'treinos_erica_' + todayStr() + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ── Instalacao do PWA ──────────────────────────────────────
var deferredPrompt = null;

function estaInstalado() {
  return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  mostrarBannerInstalar();
});

function mostrarBannerInstalar() {
  if (estaInstalado()) return;
  var b = document.getElementById('install-banner');
  if (b) b.classList.add('show');
}

async function doInstall() {
  var sub = document.getElementById('install-sub');
  var acao = document.getElementById('install-action');

  if (deferredPrompt) {
    deferredPrompt.prompt();
    var escolha = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (escolha.outcome === 'accepted') {
      document.getElementById('install-banner').classList.remove('show');
    } else {
      sub.textContent = 'Instalacao cancelada. Toque para tentar de novo.';
    }
    return;
  }

  // Sem prompt automatico — instrucoes manuais
  var ua = navigator.userAgent;
  var msg;
  if (/CriOS|Safari/.test(ua) && /iPhone|iPad/.test(ua)) {
    msg = 'No iPhone: toque no icone de Compartilhar (quadrado com seta) e escolha "Adicionar a Tela de Inicio".';
  } else if (/SamsungBrowser/.test(ua)) {
    msg = 'Navegador Samsung: menu (3 linhas) > "Adicionar pagina a" > "Tela inicial". Ou abra este link no Chrome.';
  } else if (/Firefox/.test(ua)) {
    msg = 'Firefox: menu (3 pontos) > "Instalar". Para melhor resultado, abra este link no Chrome.';
  } else if (/Chrome/.test(ua)) {
    msg = 'Chrome: menu (3 pontos, canto superior direito) > "Instalar app" ou "Adicionar a tela inicial". Se nao aparecer, recarregue a pagina e aguarde 15s.';
  } else {
    msg = 'Abra este endereco no Google Chrome para instalar: ' + window.location.href;
  }
  sub.textContent = msg;
  acao.textContent = 'OK';
  acao.onclick = function() { document.getElementById('install-banner').classList.remove('show'); };
}

window.addEventListener('appinstalled', function() {
  deferredPrompt = null;
  var b = document.getElementById('install-banner');
  if (b) b.classList.remove('show');
});

// Se o navegador nao disparar beforeinstallprompt em 3s, mostra o banner
// mesmo assim para oferecer as instrucoes manuais
setTimeout(function() {
  if (!deferredPrompt && !estaInstalado()) mostrarBannerInstalar();
}, 3000);

// ── Inicializacao ──────────────────────────────────────────
function iniciarApp() {
  if (!window.FB || !window.FB.ativo) {
    // Firebase nao configurado — modo local puro
    document.getElementById('login-overlay').style.display = 'none';
    modoLocal = true;
    setSyncBadge('local');
    loadLocal();
    render();
    return;
  }

  window.FB.onAuth(function(user) {
    var overlay = document.getElementById('login-overlay');
    var btn = document.getElementById('login-btn');
    if (user) {
      currentUser = user;
      overlay.style.display = 'none';
      setSyncBadge(navigator.onLine ? 'online' : 'offline');
      loadLocal();
      render();
      if (!estaInstalado() && (deferredPrompt || true)) mostrarBannerInstalar();
      if (unsubSessoes) unsubSessoes();
      unsubSessoes = window.FB.escutarSessoes(user.uid, function(arr) {
        sessions = arr;
        saveLocal();
        if (!activeSession) render();
      });
    } else {
      currentUser = null;
      if (unsubSessoes) { unsubSessoes(); unsubSessoes = null; }
      overlay.style.display = 'flex';
      var bn = document.getElementById('install-banner');
      if (bn) bn.classList.remove('show');
      if (btn) { btn.disabled = false; btn.textContent = (authMode === 'login') ? 'Entrar' : 'Criar conta'; }
    }
  });
}

if (window.FB) iniciarApp();
else window.addEventListener('fb-ready', iniciarApp);

// Enter envia o formulario de login
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  var ov = document.getElementById('login-overlay');
  if (ov && ov.style.display !== 'none') doAuth();
});

// Indicador de conexao
window.addEventListener('online',  function() { if (currentUser) setSyncBadge('online'); });
window.addEventListener('offline', function() { if (currentUser) setSyncBadge('offline'); });

// PWA service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
}

// Aviso ao fechar com sessao ativa
window.addEventListener('beforeunload', function(e) {
  if (activeSession) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
